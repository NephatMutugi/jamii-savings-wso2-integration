components:
  schemas:
    CustomerResponse:
      properties:
        city:
          type: string
        customerId:
          example: 1
          type: integer
        email:
          description: Returned in full to an authorised caller; masked in logs.
          format: email
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          description: Returned in full to an authorised caller; masked in logs.
          type: string
        requestId:
          type: string
        timestamp:
          format: date-time
          type: string
      required:
      - customerId
      - firstName
      - lastName
      - requestId
      - timestamp
      type: object
    ErrorResponse:
      description: |
        The single error shape used by every Jamii integration, regardless of
        whether the backend is a database, an HTTP service or a SOAP service.
      properties:
        error:
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
          type: object
        requestId:
          type: string
        timestamp:
          format: date-time
          type: string
      required:
      - error
      - requestId
      - timestamp
      type: object
  securitySchemes:
    OAuth2:
      description: Client credentials grant, issued by the APIM token endpoint.
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://localhost:9443/oauth2/token
      type: oauth2
info:
  contact:
    name: Jamii Savings Integration Team
  description: |
    Returns a customer profile from the core customer system.

    A managed proxy in WSO2 Micro Integrator fronts the upstream service. The
    response is a deliberate projection: the upstream record carries
    credentials and financial identifiers that are never exposed here.
  title: Jamii Customer Profile
  version: v1
openapi: 3.0.3
paths:
  /{customerId}:
    get:
      description: |
        Returns a filtered view of the customer record. Fields such as
        password, ssn, bank and crypto details exist upstream and are
        deliberately not passed through.
      operationId: getCustomerProfile
      parameters:
      - description: 1 to 6 digits. Anything else returns 400.
        example: "1"
        in: path
        name: customerId
        required: true
        schema:
          pattern: ^[0-9]{1,6}$
          type: string
      - description: Reused when well formed, otherwise generated.
        example: cust-demo-0001
        in: header
        name: X-Correlation-ID
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
                city: Phoenix
                customerId: 1
                email: emily.johnson@x.dummyjson.com
                firstName: Emily
                lastName: Johnson
                phone: +81 965-431-3024
                requestId: cust-demo-0001
                timestamp: "2026-10-13T11:14:32.187Z"
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: Customer found
          headers:
            X-Correlation-ID:
              schema:
                type: string
        "400":
          content:
            application/json:
              example:
                error:
                  code: INVALID_REQUEST
                  message: customerId must be 1 to 6 digits
                requestId: 367c4245-e046-4737-a1ae-5ae2dfdec074
                timestamp: "2026-10-13T11:16:18.644Z"
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: customerId is not 1 to 6 digits
        "401":
          description: Missing or invalid access token. Body is produced by the gateway.
        "404":
          content:
            application/json:
              example:
                error:
                  code: CUSTOMER_NOT_FOUND
                  message: No customer matches the supplied customer id
                requestId: 32df4a9c-3677-4ef3-a9f1-e75913d2ea5e
                timestamp: "2026-10-13T11:54:16.182Z"
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No customer matches the supplied customer id
        "429":
          description: Subscription throttling tier exhausted. Body is produced by
            the gateway.
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The customer service returned an unexpected response
        "503":
          content:
            application/json:
              example:
                error:
                  code: BACKEND_UNAVAILABLE
                  message: The upstream service is unavailable
                requestId: 52620b50-f830-4295-8120-ab7ddb409494
                timestamp: "2026-10-13T11:25:01.447Z"
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The upstream service is unavailable (connection refused)
        "504":
          content:
            application/json:
              example:
                error:
                  code: BACKEND_TIMEOUT
                  message: The upstream service did not respond in time
                requestId: 10ddcd32-9ab3-4169-b0d9-c000000000aa
                timestamp: "2026-10-13T11:20:07.975Z"
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The upstream service did not respond within 3 seconds
      security:
      - OAuth2: []
      summary: Get a customer profile
      tags:
      - customers
servers:
- description: Local gateway (self-signed certificate)
  url: https://localhost:8243/jamii/customers/v1
tags:
- name: customers
