# Jamii Savings MI runtime config. No secrets here: every value resolves
# from an environment variable, injected into the container by
# docker-compose's env_file (.env).
# VERIFY: confirm this path (conf/deployment.toml) is where the pinned
# wso2/wso2mi:4.6.0 image actually reads its config from.

[server]
hostname = "localhost"

[[datasource]]
id = "JamiiDS"
url = "$env{JAMII_DB_URL}"
username = "$env{JAMII_DB_USER}"
password = "$env{JAMII_DB_PASSWORD}"
driver = "com.mysql.cj.jdbc.Driver"
pool_options.maxActive = 10
pool_options.maxWait = 3000
pool_options.testOnBorrow = true
pool_options.validationQuery = "SELECT 1"

# Masking safety net: catches a careless log line
# that slips raw account numbers or emails through. Primary masking still
# happens in mediation, computed before anything is logged.
[masking_pattern.properties]
"ACCOUNT_NUMBER" = "\\b[0-9]{10}\\b"
"EMAIL" = "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
# Requires a leading "+" so ordinary digit sequences in logs (ports, counts,
# timestamps) are not masked into unreadability.
"PHONE" = "\\+[0-9]{1,3}[\\s-][0-9]{2,4}[\\s-][0-9]{3,4}[\\s-][0-9]{3,4}"

# Bonus B: RabbitMQ transport. Credentials come from the environment, like the
# datasource above, so nothing authenticating is committed. The inbound
# endpoint references this factory by name rather than carrying its own
# connection parameters, which keeps the broker password out of the Synapse
# artifact.
[transport.rabbitmq]
listener_enable = true
sender_enable = true

[[transport.rabbitmq.listener]]
name = "AMQPConnectionFactory"
parameter.'rabbitmq.server.host.name' = "rabbitmq"
parameter.'rabbitmq.server.port' = "5672"
parameter.'rabbitmq.server.user.name' = "$env{JAMII_MQ_USER}"
parameter.'rabbitmq.server.password' = "$env{JAMII_MQ_PASSWORD}"

[[transport.rabbitmq.sender]]
name = "AMQPConnectionFactory"
parameter.'rabbitmq.server.host.name' = "rabbitmq"
parameter.'rabbitmq.server.port' = "5672"
parameter.'rabbitmq.server.user.name' = "$env{JAMII_MQ_USER}"
parameter.'rabbitmq.server.password' = "$env{JAMII_MQ_PASSWORD}"
